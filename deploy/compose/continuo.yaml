# continuo — the API beneath Polyphony (music-api.ault.me): unified search, album requests with a
# live pipeline that never gives up, notifications, and the Subsonic façade's auth check.
# Talks to Lidarr/slskd APIs only; every download still originates from Lidarr/qBittorrent/slskd
# inside gluetun. Never touches the music files. Secrets in .env, decrypted from
# secrets/continuo.env (JWT_SECRET, LIDARR_API_KEY, LIDARR_WEBHOOK_SECRET, SLSKD_API_KEY,
# HA_WEBHOOK_URL, UPTIME_KUMA_PUSH_URL, ADMIN_PASSWORD, NAVIDROME_SERVICE_PASSWORD until Phase 2).
services:
  continuo:
    image: ghcr.io/isaacault/continuo:edge     # pin a version tag + digest once CI publishes one
    container_name: continuo
    profiles: ["media", "all"]
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      TZ: Europe/London
      PUBLIC_BASE_URL: https://music-api.ault.me
      # Lidarr and slskd live in gluetun's netns; gluetun is on the compose network.
      LIDARR_URL: http://gluetun:8686
      SLSKD_URL: http://gluetun:5030
      ROOT_FOLDER_PATH: /data/music           # Lidarr's root folder (as Lidarr sees it)
      QUALITY_PROFILE_ID: "4"                 # FLAC (MP3 Fallback) — same as lidseeker
      METADATA_PROFILE_ID: "1"                # Standard
      # Phase 1: password auth as the continuo-svc Navidrome user. Phase 2 switches to
      # NAVIDROME_AUTH=header over the music-auth network (see the Phase 2 block below).
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_MUSIC_ROOT: /music
      NAVIDROME_AUTH: password
      NAVIDROME_SERVICE_USER: continuo-svc
      ADMIN_USER: isaac                       # first boot only (password in .env)
      MUSICBRAINZ_CONTACT: https://github.com/isaacault/continuo
      DOCKER_PROXY_URL: http://continuo-docker-proxy:2375
      SOULARR_CONFIG_PATH: /soularr/config.ini
      SOULARR_DENYLIST_PATH: /soularr/failed_imports.json
      TRUST_PROXY: "true"                     # behind Caddy → rate-limit on the real client IP
    volumes:
      - /ssd/appdata/continuo:/data           # SQLite (backed up via `continuo backup`, see backup/)
      - /ssd/appdata/soularr:/soularr         # Soularr config.ini (quality toggle) + denylist (Retry)
    # No published port: only Caddy (and Lidarr's webhook, via Caddy) talk to it.
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/v1/health').status==200 else 1)"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  # Ported from lidseeker: allows exactly POST /containers/soularr/restart, 403s everything else,
  # so continuo never holds the raw Docker socket.
  continuo-docker-proxy:
    image: nginx:alpine
    container_name: continuo-docker-proxy
    profiles: ["media", "all"]
    restart: unless-stopped
    volumes:
      - ./docker-proxy.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 32m

# --- Phase 2 (the Subsonic façade) -----------------------------------------------------------
# Navidrome trusts Remote-User only from ND_EXTAUTH_TRUSTEDSOURCES. Rather than trusting the
# whole compose network (every container), Caddy, continuo and Navidrome share a tiny network
# with fixed addresses, and only Caddy's and continuo's are trusted:
#
#   networks:
#     music-auth:
#       ipam:
#         config:
#           - subnet: 172.30.42.0/29
#
#   continuo:  networks: { default: {}, music-auth: { ipv4_address: 172.30.42.3 } }
#              environment: NAVIDROME_AUTH=header, NAVIDROME_URL=http://navidrome-trusted:4533
#   caddy:     networks: { default: {}, music-auth: { ipv4_address: 172.30.42.2 } }
#   navidrome: networks: { default: {}, music-auth: { ipv4_address: 172.30.42.4,
#                                                      aliases: [navidrome-trusted] } }
#              environment: ND_EXTAUTH_TRUSTEDSOURCES=172.30.42.2/32,172.30.42.3/32
#                           ND_EXTAUTH_USERHEADER=Remote-User
